<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3f45"/>
      <stop offset="1" stop-color="#1b1c1f"/>
    </linearGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ec"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- baby head peeking over the keyboard -->
  <g>
    <circle cx="716" cy="392" r="104" fill="#f6c9a4"/>
    <path d="M676 300 C 668 264 692 240 720 248 C 744 255 748 280 730 292"
          fill="none" stroke="#4a352c" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="684" cy="382" rx="9" ry="12" fill="#3a2a24"/>
    <ellipse cx="748" cy="382" rx="9" ry="12" fill="#3a2a24"/>
    <path d="M692 418 C 706 432 728 432 742 418" fill="none" stroke="#3a2a24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="666" cy="406" r="12" fill="#eaa585" opacity="0.7"/>
    <circle cx="766" cy="406" r="12" fill="#eaa585" opacity="0.7"/>
  </g>

  <!-- keyboard -->
  <rect x="212" y="470" width="600" height="290" rx="56" fill="url(#kb)"/>
  <!-- keys -->
  <g fill="#2b2c30">
    <rect x="326" y="528" width="60" height="46" rx="11"/>
    <rect x="404" y="528" width="60" height="46" rx="11"/>
    <rect x="482" y="528" width="60" height="46" rx="11"/>
    <rect x="560" y="528" width="60" height="46" rx="11"/>
    <rect x="638" y="528" width="60" height="46" rx="11"/>
    <rect x="326" y="590" width="60" height="46" rx="11"/>
    <rect x="404" y="590" width="60" height="46" rx="11"/>
    <rect x="482" y="590" width="60" height="46" rx="11"/>
    <rect x="560" y="590" width="60" height="46" rx="11"/>
    <rect x="638" y="590" width="60" height="46" rx="11"/>
    <rect x="362" y="652" width="300" height="50" rx="13"/>
  </g>

  <!-- hands gripping the keyboard edge -->
  <g fill="#f6c9a4" stroke="#d9a982" stroke-width="4">
    <rect x="620" y="452" width="58" height="44" rx="20"/>
    <rect x="744" y="452" width="58" height="44" rx="20"/>
  </g>
</svg>
